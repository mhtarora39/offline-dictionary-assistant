# Model configuration for local Ollama server (http://localhost:11434)
default_model: "sam860/lfm2.5:350m"

models:
  "sam860/lfm2.5:350m":
    name: "sam860/lfm2.5:350m"
    ollama_tag: "sam860/lfm2.5:350m"
    options:
      temperature: 0
      seed: 0
      num_ctx: 1024
      num_predict: 32
    # think omitted: model does not support thinking

  "openbmb/minicpm5:latest":
    name: "openbmb/minicpm5:latest"
    ollama_tag: "openbmb/minicpm5:latest"
    options:
      temperature: 0
      seed: 0
      num_ctx: 1024
      num_predict: 32
    think: false

lookup:
  max_distance: 2
  require_unique_best: true
